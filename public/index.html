<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>What's on today?</h1>
      <p id="count" aria-live="polite"></p>
    </header>

    <form id="add-form" autocomplete="off">
      <label class="sr" for="title">New task</label>
      <input id="title" name="title" maxlength="200" placeholder="Add a task and press Enter" required>
      <button type="submit">Add task</button>
    </form>

    <p id="error" role="alert" hidden></p>
    <ul id="list"></ul>
    <p id="empty" hidden>No tasks yet. Add your first one above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
